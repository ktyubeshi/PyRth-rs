[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "pyrth-py"
version = "0.1.0"
requires-python = ">=3.12"
description = "Experimental PyO3 bindings for the PyRth Rust core"
license = { text = "MIT" }

[tool.maturin]
bindings = "pyo3"
module-name = "pyrth_py"
